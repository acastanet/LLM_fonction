<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">La génération est une boucle</title>
  <desc id="desc">Trois positions traversent des blocs de transformeur. Le dernier état est projeté sur le vocabulaire, un token est sélectionné puis ajouté à la séquence.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#536270" stroke-width="1.8"/></marker>
    <style>.title{font:700 34px system-ui,sans-serif;fill:#243447}.sub{font:400 18px system-ui,sans-serif;fill:#536270}.label{font:700 19px system-ui,sans-serif;fill:#243447}.small{font:400 15px system-ui,sans-serif;fill:#536270}.token{font:700 18px system-ui,sans-serif;fill:#243447}.arrow{stroke:#536270;stroke-width:3;fill:none;marker-end:url(#arrow)}</style>
  </defs>
  <rect width="1200" height="675" fill="#F8F7F2"/>
  <text x="64" y="70" class="title">La génération est une boucle</text>
  <text x="64" y="104" class="sub">Un état par position, puis une probabilité sur le prochain token</text>

  <rect x="70" y="170" width="500" height="340" rx="20" fill="#FFFFFF" stroke="#D3D0C8" stroke-width="2"/>
  <text x="100" y="207" class="label">Blocs de transformeur</text>
  <text x="100" y="232" class="small">attention causale + transformations locales</text>
  <g fill="#EEEAF8" stroke="#5A4FB3" stroke-width="2">
    <rect x="120" y="280" width="110" height="54" rx="12"/><rect x="270" y="280" width="110" height="54" rx="12"/><rect x="420" y="280" width="110" height="54" rx="12"/>
    <rect x="120" y="385" width="110" height="54" rx="12"/><rect x="270" y="385" width="110" height="54" rx="12"/><rect x="420" y="385" width="110" height="54" rx="12"/>
  </g>
  <g stroke="#536270" stroke-width="2.5" fill="none" marker-end="url(#arrow)">
    <path d="M175 380 V340"/><path d="M325 380 V340"/><path d="M475 380 V340"/>
    <path d="M232 412 H265"/><path d="M382 412 H415"/><path d="M232 307 H265"/><path d="M382 307 H415"/>
  </g>
  <g fill="#E8F1F0" stroke="#2E7D75" stroke-width="2">
    <rect x="120" y="465" width="110" height="48" rx="10"/><rect x="270" y="465" width="110" height="48" rx="10"/><rect x="420" y="465" width="110" height="48" rx="10"/>
  </g>
  <text x="175" y="496" text-anchor="middle" class="token">Le</text><text x="325" y="496" text-anchor="middle" class="token">chat</text><text x="475" y="496" text-anchor="middle" class="token">noir</text>

  <path d="M530 307 H616" class="arrow"/>
  <rect x="620" y="230" width="190" height="154" rx="18" fill="#E7EDF4" stroke="#42658A" stroke-width="2"/>
  <text x="715" y="270" text-anchor="middle" class="label">Dernier état</text>
  <text x="715" y="308" text-anchor="middle" class="small">projection sur</text><text x="715" y="330" text-anchor="middle" class="small">le vocabulaire</text>
  <text x="715" y="360" text-anchor="middle" class="small">→ logits → softmax</text>

  <path d="M810 307 H856" class="arrow"/>
  <rect x="860" y="230" width="155" height="154" rx="18" fill="#F7EBD8" stroke="#C98B2E" stroke-width="2"/>
  <text x="938" y="270" text-anchor="middle" class="label">Sélection</text>
  <text x="938" y="310" text-anchor="middle" class="small">probabilités</text><text x="938" y="334" text-anchor="middle" class="small">+ réglages</text>
  <text x="938" y="365" text-anchor="middle" class="token">« dort »</text>

  <path d="M1015 307 H1060 V525 H610 V519" class="arrow"/>
  <rect x="555" y="465" width="110" height="48" rx="10" fill="#F7EBD8" stroke="#C98B2E" stroke-width="2"/>
  <text x="610" y="496" text-anchor="middle" class="token">dort</text>
  <text x="815" y="557" text-anchor="middle" class="label">Le token rejoint la séquence</text>
  <text x="815" y="582" text-anchor="middle" class="small">puis le prochain tour commence</text>

  <text x="64" y="630" class="small">Réel : dépendance causale et boucle autoregressive. Simplifié : les têtes d'attention, résidus, normalisations et le cache KV.</text>
</svg>
