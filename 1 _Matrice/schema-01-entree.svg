<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">Du texte aux représentations contextuelles</title>
  <desc id="desc">Schéma simplifié en cinq étapes : phrase, tokens, identifiants, plongements initiaux et représentations contextuelles ordonnées.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#536270" stroke-width="1.8"/></marker>
    <style>
      .title{font:700 34px system-ui,sans-serif;fill:#243447}.sub{font:400 18px system-ui,sans-serif;fill:#536270}.label{font:700 20px system-ui,sans-serif;fill:#243447}.small{font:400 16px system-ui,sans-serif;fill:#536270}.mono{font:600 18px ui-monospace,monospace;fill:#243447}.box{stroke-width:2}.arrow{stroke:#536270;stroke-width:3;fill:none;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="1200" height="675" fill="#F8F7F2"/>
  <text x="64" y="70" class="title">Une phrase doit devenir calculable</text>
  <text x="64" y="104" class="sub">Cinq objets distincts, reliés sans confondre désignation et représentation</text>

  <rect x="64" y="190" width="190" height="180" rx="18" fill="#E8F1F0" stroke="#2E7D75" class="box"/>
  <text x="159" y="230" text-anchor="middle" class="label">Texte</text>
  <text x="159" y="278" text-anchor="middle" class="small">« Pourquoi</text>
  <text x="159" y="304" text-anchor="middle" class="small">aimons-nous</text>
  <text x="159" y="330" text-anchor="middle" class="small">le sucre ? »</text>

  <path d="M254 280 H287" class="arrow"/>
  <rect x="290" y="190" width="190" height="180" rx="18" fill="#EEEAF8" stroke="#5A4FB3" class="box"/>
  <text x="385" y="230" text-anchor="middle" class="label">Tokens</text>
  <rect x="317" y="260" width="58" height="38" rx="8" fill="#FFFFFF" stroke="#5A4FB3"/><rect x="382" y="260" width="70" height="38" rx="8" fill="#FFFFFF" stroke="#5A4FB3"/>
  <text x="346" y="285" text-anchor="middle" class="small">anti</text><text x="417" y="285" text-anchor="middle" class="small">consti…</text>
  <text x="385" y="333" text-anchor="middle" class="small">découpage dépendant</text><text x="385" y="355" text-anchor="middle" class="small">du tokenizer</text>

  <path d="M480 280 H513" class="arrow"/>
  <rect x="516" y="190" width="160" height="180" rx="18" fill="#F7EBD8" stroke="#C98B2E" class="box"/>
  <text x="596" y="230" text-anchor="middle" class="label">Identifiants</text>
  <text x="596" y="292" text-anchor="middle" class="mono">428 · 91 · 7</text>
  <text x="596" y="333" text-anchor="middle" class="small">des adresses,</text><text x="596" y="355" text-anchor="middle" class="small">pas des quantités</text>

  <path d="M676 280 H709" class="arrow"/>
  <rect x="712" y="190" width="190" height="180" rx="18" fill="#E7EDF4" stroke="#42658A" class="box"/>
  <text x="807" y="230" text-anchor="middle" class="label">Plongements</text>
  <text x="807" y="286" text-anchor="middle" class="mono">[0,21 ; -0,47 ; …]</text>
  <text x="807" y="333" text-anchor="middle" class="small">vecteurs initiaux</text><text x="807" y="355" text-anchor="middle" class="small">appris</text>

  <path d="M902 280 H935" class="arrow"/>
  <rect x="938" y="190" width="198" height="180" rx="18" fill="#F3E6E3" stroke="#A85D4A" class="box"/>
  <text x="1037" y="230" text-anchor="middle" class="label">Contexte</text>
  <path d="M974 282 C1002 247 1027 317 1054 282 S1107 317 1124 282" fill="none" stroke="#A85D4A" stroke-width="4"/>
  <text x="1037" y="333" text-anchor="middle" class="small">un état par occurrence</text><text x="1037" y="355" text-anchor="middle" class="small">et par position</text>

  <rect x="64" y="465" width="1072" height="116" rx="16" fill="#FFFFFF" stroke="#D3D0C8"/>
  <text x="92" y="505" class="label">Légende</text>
  <text x="92" y="540" class="small">Réel : la chaîne d'objets calculés. Simplifié : le découpage et la taille des vecteurs.</text>
  <text x="92" y="567" class="small">Métaphorique : aucune boîte ne contient à elle seule le « sens » du texte.</text>
</svg>
